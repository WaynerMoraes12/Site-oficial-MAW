# Publica o site no GitHub Pages a cada push na main (a tarefa diária sobe o World Tour e o último
# release da MAW, então o site se atualiza sozinho) e quando alguém dispara à mão.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# só leitura por padrão; publicar no Pages fica restrito ao job de deploy
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://waynermoraes12.github.io
      BASE_PATH: /Site-oficial-MAW
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # o botão de download só vai ao ar se o instalador do release.json já estiver publicado (e igual);
      # enquanto não for público (a MAW ainda é privada), o site vai ao ar com "Installer coming soon"
      - name: Download público ou "coming soon"
        run: |
          node tools/check-release.mjs || (echo "instalador ainda nao e publico, o site sai com Installer coming soon" && rm -f src/data/release.json)
      - run: npm run build
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
